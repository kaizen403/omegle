version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omegle-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: omegle
      POSTGRES_PASSWORD: omegle
      POSTGRES_DB: omegle
    volumes:
      - omegle-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omegle -d omegle"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: omegle-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  app:
    profiles: ["packaged"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omegle-vitap-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=${PORT:-8080}
      - NODE_ENV=${NODE_ENV:-development}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - TURN_HOST=${TURN_HOST:-localhost}
      - TURN_PORT=${TURN_PORT:-3478}
      - TURN_AUTH_SECRET=${TURN_AUTH_SECRET:-dev-turn-secret}
      - TURN_REALM=${TURN_REALM:-omegle}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    volumes:
      - ./logs:/app/logs
    depends_on:
      - coturn
      - postgres
      - redis

  coturn:
    image: coturn/coturn:4.6
    container_name: omegle-coturn
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49259:49160-49259/udp"
    command:
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49259
      - --fingerprint
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${TURN_AUTH_SECRET:-dev-turn-secret}
      - --realm=${TURN_REALM:-omegle}
      - --external-ip=${TURN_HOST:-127.0.0.1}
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --no-cli
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  omegle-pg-data:
