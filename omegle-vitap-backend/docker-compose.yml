version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omegle-vitap-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=${PORT:-8080}
      - NODE_ENV=${NODE_ENV:-development}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - TURN_HOST=${TURN_HOST:-localhost}
      - TURN_PORT=${TURN_PORT:-3478}
      - TURN_AUTH_SECRET=${TURN_AUTH_SECRET:-dev-turn-secret}
      - TURN_REALM=${TURN_REALM:-omegle}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    volumes:
      - ./logs:/app/logs
    depends_on:
      - coturn

  coturn:
    image: coturn/coturn:4.6
    container_name: omegle-coturn
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49259:49160-49259/udp"
    command:
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49259
      - --fingerprint
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${TURN_AUTH_SECRET:-dev-turn-secret}
      - --realm=${TURN_REALM:-omegle}
      - --external-ip=${TURN_HOST:-127.0.0.1}
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --no-cli
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
