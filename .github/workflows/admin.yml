name: Admin CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/admin/**'
      - '.github/workflows/admin.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/admin/**'
      - '.github/workflows/admin.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

defaults:
  run:
    working-directory: apps/admin

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/admin/package.json
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-admin-${{ hashFiles('apps/admin/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-admin-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run lint
      - run: pnpm run format:check

  type-check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/admin/package.json
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-admin-${{ hashFiles('apps/admin/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-admin-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run type-check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/admin/package.json
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-admin-${{ hashFiles('apps/admin/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-admin-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/admin/package.json
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-admin-${{ hashFiles('apps/admin/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-admin-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_DEV_MODE: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: apps/admin/out/
          retention-days: 1

  deploy:
    name: Cloudflare Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: admin-build
          path: apps/admin/out
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/admin/out --project-name=omegle-admin --commit-dirty=true
