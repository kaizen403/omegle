name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'infra/**'
      - '.github/workflows/api-deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  NODE_VERSION: '20'

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm test

  deploy:
    name: ECR + EC2
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push image
        working-directory: apps/api
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          docker build --platform linux/amd64 -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "IMAGE_URI=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Upload compose files
        run: |
          aws s3 cp infra/compose.yml "s3://${{ vars.OPS_BUCKET }}/compose.yml"
          aws s3 cp infra/Caddyfile "s3://${{ vars.OPS_BUCKET }}/Caddyfile"
          aws s3 cp infra/deploy.sh "s3://${{ vars.OPS_BUCKET }}/deploy.sh"

      - name: Record image and start instance
        run: |
          aws ssm put-parameter \
            --name /omegle/prod/IMAGE_URI \
            --type String \
            --value "${IMAGE_URI}" \
            --overwrite
          STATE="$(aws ec2 describe-instances \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)"
          if [[ "$STATE" == "stopped" ]]; then
            aws ec2 start-instances --instance-ids "${{ vars.EC2_INSTANCE_ID }}"
          fi
          aws ec2 wait instance-running --instance-ids "${{ vars.EC2_INSTANCE_ID }}"
          aws ec2 wait instance-status-ok --instance-ids "${{ vars.EC2_INSTANCE_ID }}"

      - name: Deploy with SSM
        run: |
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "omegle-api ${GITHUB_SHA}" \
            --timeout-seconds 600 \
            --parameters 'commands=["set -euo pipefail","aws s3 cp s3://'"${{ vars.OPS_BUCKET }}"'/deploy.sh /opt/omegle/deploy.sh","chmod +x /opt/omegle/deploy.sh","AWS_REGION='"${AWS_REGION}"' OPS_BUCKET='"${{ vars.OPS_BUCKET }}"' /opt/omegle/deploy.sh"]' \
            --query 'Command.CommandId' \
            --output text)"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"
          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query 'Status' \
            --output text)"
          if [[ "$STATUS" != "Success" ]]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query 'StandardErrorContent' \
              --output text
            exit 1
          fi
