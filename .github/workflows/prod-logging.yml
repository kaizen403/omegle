name: Prod logging

# Apply LOG_LEVEL on the live API box and print redacted auth/join lines.
# Does not rebuild the image. Shares the deploy-api-prod lock with Deploy API.
on:
  workflow_dispatch:
    inputs:
      log_level:
        description: Winston LOG_LEVEL for the API container
        type: choice
        options: [debug, info, warn]
        default: debug
      deploy_web_with_server_key:
        description: Unused; server is aligned to the published Pages key instead
        type: boolean
        default: false
      align_server_to_web_key:
        description: Set the live API container API_KEY to the published NEXT_PUBLIC_API_KEY
        type: boolean
        default: true

concurrency:
  group: deploy-api-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  apply:
    name: Set LOG_LEVEL and read auth logs
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fingerprint Pages NEXT_PUBLIC_API_KEY
        env:
          NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          val = os.environ.get("NEXT_PUBLIC_API_KEY") or ""
          digest = hashlib.sha256(val.encode()).hexdigest()[:12] if val else "missing"
          print(f"pages_api_key_fingerprint={digest} len={len(val)} set={'yes' if bool(val) else 'no'}")
          PY

      - name: Upload compose with LOG_LEVEL
        run: aws s3 cp infra/compose.yml "s3://${{ vars.OPS_BUCKET }}/compose.yml"

      - name: Apply LOG_LEVEL and fetch auth logs
        env:
          LOG_LEVEL: ${{ inputs.log_level }}
          OPS_BUCKET: ${{ vars.OPS_BUCKET }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          SCRIPT="$(mktemp)"
          cat > "$SCRIPT" <<EOF
          set -euo pipefail
          APP_DIR=/opt/omegle
          cd "\$APP_DIR"
          LEVEL='${LOG_LEVEL}'
          if grep -q '^LOG_LEVEL=' .env; then
            sed -i "s/^LOG_LEVEL=.*/LOG_LEVEL=\${LEVEL}/" .env
          else
            printf 'LOG_LEVEL=%s\n' "\${LEVEL}" >> .env
          fi
          if grep -q '^LOG_LEVEL=' .image.env; then
            sed -i "s/^LOG_LEVEL=.*/LOG_LEVEL=\${LEVEL}/" .image.env
          else
            printf 'LOG_LEVEL=%s\n' "\${LEVEL}" >> .image.env
          fi
          aws s3 cp "s3://${OPS_BUCKET}/compose.yml" "\${APP_DIR}/compose.yml"
          docker compose --env-file "\${APP_DIR}/.image.env" -f "\${APP_DIR}/compose.yml" up -d --force-recreate --no-deps api
          for _ in \$(seq 1 30); do
            if curl -fsS http://127.0.0.1/health >/dev/null; then
              echo "API healthy"
              break
            fi
            sleep 2
          done
          python3 - <<'PY'
          import hashlib, pathlib
          text = pathlib.Path("/opt/omegle/.env").read_text()
          values = {}
          for line in text.splitlines():
              if "=" in line and not line.startswith("#"):
                  key, value = line.split("=", 1)
                  values[key] = value
          api_key = values.get("API_KEY", "")
          digest = hashlib.sha256(api_key.encode()).hexdigest()[:12] if api_key else "missing"
          print(f"server_api_key_fingerprint={digest} len={len(api_key)} set={'yes' if bool(api_key) else 'no'}")
          print(f"log_level_env={values.get('LOG_LEVEL', 'unset')}")
          PY
          echo "container_LOG_LEVEL=\$(docker compose --env-file "\${APP_DIR}/.image.env" -f "\${APP_DIR}/compose.yml" exec -T api printenv LOG_LEVEL || true)"
          echo "----- recent auth/join logs -----"
          docker compose --env-file "\${APP_DIR}/.image.env" -f "\${APP_DIR}/compose.yml" logs --tail 250 api \\
            | grep -E 'AUTH REJECTED|RATE LIMIT|CAPACITY|PER-IP CAP|JOIN |Logger initialized|SOCKET.IO CONNECTED|SOCKET.IO DISCONNECTED' \\
            || echo "(no matching lines in last 250)"
          EOF

          PARAMS="$(python3 -c 'import json,sys; print(json.dumps({"commands":[open(sys.argv[1]).read()]}))' "$SCRIPT")"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "omegle-prod-logging ${GITHUB_SHA}" \
            --timeout-seconds 180 \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${INSTANCE_ID}"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${INSTANCE_ID}" \
            --query 'Status' \
            --output text)"
          test "$STATUS" = "Success"

  align-server-to-web-key:
    name: Align live API_KEY to published Pages key
    if: ${{ inputs.align_server_to_web_key }}
    needs: apply
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set container API_KEY to the published web key
        env:
          WEB_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          python3 << 'PY'
          import hashlib, json, os, subprocess, tempfile, time

          key = os.environ.get("WEB_KEY") or ""
          instance = os.environ["INSTANCE_ID"]
          if not key:
              raise SystemExit("NEXT_PUBLIC_API_KEY secret is empty")
          print(f"web_api_key_fingerprint={hashlib.sha256(key.encode()).hexdigest()[:12]} len={len(key)}")

          remote = f"""set -euo pipefail
          APP_DIR=/opt/omegle
          cd "$APP_DIR"
          grep '^API_KEY=' .env > .api-key-ssm-backup || true
          chmod 600 .api-key-ssm-backup
          python3 - <<'PYSET'
          from pathlib import Path
          key = {key!r}
          path = Path("/opt/omegle/.env")
          lines = path.read_text().splitlines()
          out, found = [], False
          for line in lines:
              if line.startswith("API_KEY="):
                  out.append("API_KEY=" + key)
                  found = True
              else:
                  out.append(line)
          if not found:
              out.append("API_KEY=" + key)
          path.write_text("\\n".join(out) + "\\n")
          PYSET
          docker compose --env-file .image.env -f compose.yml up -d --force-recreate --no-deps api
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1/health >/dev/null; then
              echo "API healthy"
              break
            fi
            sleep 2
          done
          python3 - <<'PY2'
          import hashlib, pathlib
          values = {{}}
          for line in pathlib.Path("/opt/omegle/.env").read_text().splitlines():
              if "=" in line and not line.startswith("#"):
                  k, v = line.split("=", 1)
                  values[k] = v
          api_key = values.get("API_KEY", "")
          digest = hashlib.sha256(api_key.encode()).hexdigest()[:12] if api_key else "missing"
          print(f"server_api_key_fingerprint={{digest}} len={{len(api_key)}}")
          PY2
          """

          params_path = tempfile.mktemp(suffix=".json")
          with open(params_path, "w") as fh:
              json.dump({"commands": [remote]}, fh)

          cmd_id = subprocess.check_output(
              [
                  "aws", "ssm", "send-command",
                  "--instance-ids", instance,
                  "--document-name", "AWS-RunShellScript",
                  "--comment", "omegle-align-api-key",
                  "--timeout-seconds", "180",
                  "--parameters", f"file://{params_path}",
                  "--query", "Command.CommandId",
                  "--output", "text",
              ],
              text=True,
          ).strip()
          subprocess.check_call(
              [
                  "aws", "ssm", "wait", "command-executed",
                  "--command-id", cmd_id,
                  "--instance-id", instance,
              ]
          )
          out = subprocess.check_output(
              [
                  "aws", "ssm", "get-command-invocation",
                  "--command-id", cmd_id,
                  "--instance-id", instance,
                  "--query", "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}",
                  "--output", "json",
              ],
              text=True,
          )
          print(out)
          status = subprocess.check_output(
              [
                  "aws", "ssm", "get-command-invocation",
                  "--command-id", cmd_id,
                  "--instance-id", instance,
                  "--query", "Status",
                  "--output", "text",
              ],
              text=True,
          ).strip()
          if status != "Success":
              raise SystemExit(status)
          PY
